name: agricart
description: A Flutter mobile application with BLoC architecture.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  bloc: ^9.1.0
  http: ^0.13.5
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_messaging: ^14.7.10
  cloud_firestore: ^4.13.6
  image_picker: ^1.0.7
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  flutter_local_notifications: ^17.0.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0
  web_socket_channel: ^2.4.0
  url_launcher: ^6.2.4
  app_links: ^6.3.3
  flutter_map: ^4.0.0
  latlong2: ^0.8.1
  mapbox_search: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    # .env file is needed for mobile builds to load environment variables
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/agricart_logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/agricart_logo.jpeg"

